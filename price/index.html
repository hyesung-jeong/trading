<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주가 업데이트 v2</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1a1d21;--dim:#6b7280;--mut:#9aa0a8;--accent:#2e7d5b;--pos:#c0392b;--neg:#2471a3;--mono:'SF Mono',ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171a;--panel:#1e2126;--line:#2c3138;--ink:#e6e8ea;--dim:#9aa0a8;--mut:#6b7280;--panel2:#242830}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top a{text-decoration:none;color:var(--dim);font-size:20px}
h1{font-size:19px;margin:0;font-weight:700}
.badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.sub{color:var(--dim);font-size:12px;margin:2px 0 14px}
.sync{font-size:12px;color:var(--dim);margin-bottom:14px;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.drow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.drow label{font-weight:600;font-size:14px}
input[type=date],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:14px;font-family:var(--mono)}
input[type=date]{font-family:inherit}
.tk{display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:9px}
.tk .name{font-weight:700;font-size:14px}
.tk .fld{display:flex;flex-direction:column;gap:2px}
.tk .fld span{font-size:10px;color:var(--mut)}
.tk input{width:100%;text-align:right}
.tk.two{grid-template-columns:64px 1fr 1fr 1fr}
.tk.two .spacer{}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn:active{opacity:.85}
.btn.sec{background:var(--panel);color:var(--dim);border:1px solid var(--line);font-size:13px;padding:9px;margin-top:8px}
.msg{font-size:13px;margin-top:10px;text-align:center;min-height:18px}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:11px}
th:first-child,td:first-child{text-align:left}
.del{color:var(--pos);cursor:pointer;font-size:11px}
.hint{font-size:11px;color:var(--mut);margin-top:2px}
.empty{color:var(--mut);text-align:center;padding:20px;font-size:13px}
</style></head><body>
<div class="wrap">

      <div class="spacer"></div></div>
    <button class="btn" onclick="submitPrice()">＋ 업데이트</button>
    <div class="msg" id="msg"></div>
  </div>

  const merged={}; // ymd → {c,l,h?,o?, added:bool}
  BASE_PRICES.forEach(row=>{ const y=row[0]; const c=row[ci[tk+'_c']]; if(c==='')return; const o={c:c,l:row[ci[tk+'_l']]}; if(hasHi)o.h=row[ci[tk+'_h']]; if(tk==='SOXL')o.o=row[ci['SOXL_o']]; merged[y]=o; });
  for(const y in added){ merged[y]=Object.assign({},added[y],{_add:true}); }
  const ymds=Object.keys(merged).sort((a,b)=>b.localeCompare(a)); // 최근순
  let h='<table><thead><tr><th>날짜</th>'+(tk==='SOXL'?'<th>시가</th>':'')+'<th>종가</th><th>저가</th>'+(hasHi?'<th>고가</th>':'')+'<th></th></tr></thead><tbody>';
  const LIMIT=400; // 너무 많으면 최근 400일만
  ymds.slice(0,LIMIT).forEach(y=>{
    const m=merged[y]; const hi=m._add?'background:rgba(36,113,163,.12)':'';
    h+='<tr style="'+hi+'"><td>'+fmtYmd(y).slice(2)+(m._add?' <span style="color:var(--neg);font-size:9px">입력</span>':'')+'</td>'
      +(tk==='SOXL'?'<td>'+(m.o!=null&&m.o!==''?m.o:'-')+'</td>':'')
      +'<td>'+m.c+'</td><td>'+(m.l!=null?m.l:'-')+'</td>'
      +(hasHi?'<td>'+(m.h!=null?m.h:'-')+'</td>':'')
      +'<td>'+(m._add?'<span class="del" onclick="delRow(\''+y+'\')">삭제</span>':'')+'</td></tr>';
  });
  h+='</tbody></table>';
  if(ymds.length>LIMIT) h+='<div class="hint" style="text-align:center;margin-top:6px">최근 '+LIMIT+'일만 표시 (전체 '+ymds.length+'일)</div>';
  w.innerHTML=h;
}
async function submitPrice(){
  const msg=document.getElementById('msg'); msg.style.color='var(--dim)'; msg.textContent='';
  const dateStr=document.getElementById('d_date').value;
  if(!dateStr){ msg.style.color='var(--pos)'; msg.textContent='날짜를 선택하세요.'; return; }
  const d=ymd(dateStr);
  const rec={d};
  let missing=[];
  for(const [tk,flds] of TKS){
    const o={};
    for(const f of flds){
      const v=parseFloat(document.getElementById(tk+'_'+f).value);
      if(isNaN(v)){ missing.push(tk+' '+({o:'시가',c:'종가',l:'저가',h:'고가'})[f]); }
      else o[f]=Math.round(v*100)/100;
    }
    rec[tk]=o;
  }
  if(missing.length){ msg.style.color='var(--pos)'; msg.textContent='빈 칸: '+missing.join(', '); return; }
  // 같은 날짜 있으면 교체
  PRICES=PRICES.filter(r=>r.d!==d); PRICES.push(rec);
  PRICES.sort((a,b)=>a.d.localeCompare(b.d));
  msg.textContent='저장 중…';
  try{ await cloudSave(); msg.style.color='#2e7d5b'; msg.textContent='✓ '+fmtYmd(d)+' 업데이트 완료. 백테·폭락적립에 자동 반영됩니다.'; }
  catch(e){ msg.style.color='var(--pos)'; msg.textContent='저장 실패: '+e.message; return; }
  renderList();
  // 입력칸 비우기 (다음 날짜 편하게)
  document.querySelectorAll('input[type=number]').forEach(i=>i.value='');
  // 날짜 +1일
  const nx=new Date(dateStr); nx.setDate(nx.getDate()+1);
  document.getElementById('d_date').value=nx.toISOString().slice(0,10);
}
async function delRow(d){
  if(!confirm(fmtYmd(d)+' 주가를 삭제할까요?')) return;
  PRICES=PRICES.filter(r=>r.d!==d);
  try{ await cloudSave(); }catch(e){ alert('삭제 저장 실패: '+e.message); return; }
  renderList();
}
function askCode(){ /* 주가코드는 고정(hs-price) — 안내만 */ alert('주가는 공용 코드('+PRICE_CODE+')로 저장되어 모든 기기·모든 툴이 공유합니다.'); }
init();
</script>
