<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LOC 퉁치기 v1.2</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#f5f7fa; --line:#e2e7ee;
    --ink:#1a2230; --sub:#6b7686; --dim:#9aa5b4;
    --buy:#e23b3b; --buy-bg:#fdecec; --sell:#1f6fe0; --sell-bg:#eaf2fd;
    --gold:#b7791f; --ok:#1a9e6a; --ok-bg:#eafaf3;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding-bottom:44px}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  header{display:flex;align-items:baseline;gap:8px;margin:6px 2px 6px}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
  header .ver{font-size:11px;color:#fff;background:var(--ink);border-radius:20px;padding:2px 8px;font-family:var(--mono);font-weight:600}
  header .tag{font-size:12px;color:var(--sub);margin-left:auto}
  .hint{font-size:12.5px;color:var(--sub);margin:2px 2px 16px;line-height:1.55}
  .hint b{color:var(--ink)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .phead{padding:9px 12px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
  .phead.buy{background:var(--buy-bg);color:var(--buy)}
  .phead.sell{background:var(--sell-bg);color:var(--sell)}
  .rowhdr{display:grid;grid-template-columns:46px 1fr 1fr 26px;gap:5px;font-size:11px;color:var(--dim);padding:7px 10px 2px}
  .rowhdr span:nth-child(2),.rowhdr span:nth-child(3){text-align:right;padding-right:4px}
  .row{display:grid;grid-template-columns:46px 1fr 1fr 26px;gap:5px;align-items:center;padding:4px 10px}
  .row input,.row select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;
    padding:8px 6px;font-family:var(--mono);font-size:13.5px;text-align:right;outline:none}
  .row select{text-align:left;font-family:var(--sans);font-size:12px;padding:8px 2px 8px 6px}
  .row input.moc{opacity:.35}
  .mocwrap{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;user-select:none;font-size:9px;color:var(--sub);padding-top:2px}
  .mocwrap input{width:17px;height:17px;accent-color:var(--gold);margin:0;cursor:pointer}
  .buy .row input:focus{border-color:var(--buy);background:#fff} .sell .row input:focus{border-color:var(--sell);background:#fff}
  .del{background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;padding:2px;border-radius:6px}
  .del:hover{color:var(--buy);background:var(--panel2)}
  .addbtn{width:calc(100% - 20px);margin:8px 10px 10px;padding:8px;background:transparent;border:1px dashed var(--line);
    color:var(--sub);border-radius:8px;cursor:pointer;font-size:13px}
  .addbtn:hover{border-color:var(--sub);color:var(--ink)}

  .result{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .rhead{padding:10px 14px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .rhead small{font-weight:500;color:var(--sub);font-size:11px}
  .rcolhdr{display:grid;grid-template-columns:70px 66px 1fr 1fr;gap:8px;font-size:11px;color:var(--dim);padding:8px 14px 2px}
  .rcolhdr span:nth-child(3),.rcolhdr span:nth-child(4){text-align:right;padding-right:6px}
  .rline{display:grid;grid-template-columns:70px 66px 1fr 1fr;gap:8px;align-items:center;padding:7px 14px;
    border-top:1px solid var(--line);font-family:var(--mono);font-size:14px}
  .rline .g{font-family:var(--sans);font-weight:700;font-size:13px}
  .rline .m{font-family:var(--sans);color:var(--sub);font-size:12px}
  .rline .v{text-align:right;padding-right:6px}
  .rline .v.p{color:var(--gold)}
  .rline.b .g{color:var(--sell)} .rline.s .g{color:var(--buy)}
  .rempty{padding:16px 14px;color:var(--dim);font-size:13px}

  .verify{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);
    display:flex;flex-wrap:wrap;gap:6px 16px;background:var(--panel2)}
  .verify b{color:var(--ok);font-family:var(--mono)} .verify .x{color:var(--buy)}

  .toolbar{display:flex;gap:8px;margin:14px 2px 0;align-items:center}
  .tbtn{background:var(--panel);border:1px solid var(--line);color:var(--sub);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  .tbtn:hover{color:var(--ink);border-color:var(--sub)}
  .tick{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .tick input{width:64px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;
    padding:6px;font-family:var(--mono);font-size:12.5px;text-align:right;outline:none}
  .save{font-size:11px;color:var(--dim);margin-top:12px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>LOC 퉁치기 v1.2</h1><span class="ver">v1.2</span><span class="tag">여러 주문 → 실제 넣을 주문</span></header>
  <p class="hint">매수·매도 주문을 여러 개 입력하면 <b>자전거래 없이 어떤 종가에도 원주문과 똑같은 체결</b>이 되도록 실제로 넣을 주문을 뽑아줍니다.
    기본은 <b>LOC</b>(지정가 종가). <b>MOC</b>를 체크하면 가격 없이 무조건 체결되는 시장가 종가 주문이 됩니다.</p>

  <div class="cols">
    <div class="panel buy">
      <div class="phead buy">매수 주문</div>
      <div class="rowhdr"><span>MOC</span><span>주문가</span><span>수량</span><span></span></div>
      <div id="buyRows"></div>
      <button class="addbtn" data-side="buy">+ 매수 추가</button>
    </div>
    <div class="panel sell">
      <div class="phead sell">매도 주문</div>
      <div class="rowhdr"><span>MOC</span><span>주문가</span><span>수량</span><span></span></div>
      <div id="sellRows"></div>
      <button class="addbtn" data-side="sell">+ 매도 추가</button>
    </div>
  </div>

  <div class="result">
    <div class="rhead"><span>퉁치기 주문 (실제로 넣을 주문)</span><small id="rcount"></small></div>
    <div class="rcolhdr"><span>구분</span><span>거래</span><span>주문가</span><span>수량</span></div>
    <div id="out"></div>
    <div class="verify" id="verify"></div>
  </div>

  <div class="toolbar">
    <button class="tbtn" id="btnReset">초기화</button>
    <button class="tbtn" id="btnEx">예시</button>
    <label class="tick">틱 <input id="tick" value="0.01" inputmode="decimal"></label>
  </div>
  <div class="save" id="save">자동저장됨</div>
</div>

<script>
const KEY="hs2_tungchi_nm_v2";
const buyRows=document.getElementById("buyRows"), sellRows=document.getElementById("sellRows");
const tickEl=document.getElementById("tick"), outEl=document.getElementById("out"), verifyEl=document.getElementById("verify");

function addRow(side,type="LOC",p="",q=""){
  const box=side==="buy"?buyRows:sellRows;
  const div=document.createElement("div"); div.className="row";
  div.innerHTML=`<label class="mocwrap"><input type="checkbox" class="t"><span>MOC</span></label>
    <input class="p" inputmode="decimal" placeholder="0.00"><input class="q" inputmode="numeric" placeholder="0"><button class="del">×</button>`;
  div.querySelector(".t").checked=(type==="MOC"); div.querySelector(".p").value=p; div.querySelector(".q").value=q;
  const refresh=()=>{const moc=div.querySelector(".t").checked;const pi=div.querySelector(".p");
    pi.disabled=moc; pi.classList.toggle("moc",moc); pi.placeholder=moc?"—":"0.00";};
  refresh();
  div.querySelector(".del").onclick=()=>{div.remove();compute();save();};
  div.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{refresh();compute();save();}));
  div.querySelector(".t").addEventListener("change",()=>{refresh();compute();save();});
  box.appendChild(div);
}
function read(box,side){
  const out=[];
  box.querySelectorAll(".row").forEach(r=>{
    const t=r.querySelector(".t").checked?"MOC":"LOC";
    const p=parseFloat(r.querySelector(".p").value), q=parseFloat(r.querySelector(".q").value);
    if(isNaN(q)||q<=0) return;
    if(t==="MOC") out.push({t:"MOC",s:side,p:null,q});
    else if(!isNaN(p)) out.push({t:"LOC",s:side,p,q});
  });
  return out;
}
function tickDecimals(t){const s=String(t);const i=s.indexOf(".");return i<0?0:s.length-i-1;}

function build(orders,tick){
  const dec=tickDecimals(tick), rd=x=>Math.round(x/tick)*tick;
  const Mbuy=orders.filter(o=>o.t==="MOC"&&o.s==="buy").reduce((a,o)=>a+o.q,0);
  const Msell=orders.filter(o=>o.t==="MOC"&&o.s==="sell").reduce((a,o)=>a+o.q,0);
  const Mnet=Mbuy-Msell;
  const Lb=orders.filter(o=>o.t==="LOC"&&o.s==="buy"), Ls=orders.filter(o=>o.t==="LOC"&&o.s==="sell");
  const Lbtot=Lb.reduce((a,o)=>a+o.q,0), Lstot=Ls.reduce((a,o)=>a+o.q,0);
  const g=C=>Mnet+Lb.reduce((n,o)=>n+(C<=o.p+1e-9?o.q:0),0)-Ls.reduce((n,o)=>n+(C>=o.p-1e-9?o.q:0),0);
  const gHigh=Mnet-Lstot, gLow=Mnet+Lbtot;
  const cand=new Set();
  for(const o of Lb.concat(Ls))for(const d of[-tick,0,tick])cand.add(rd(o.p+d).toFixed(dec));
  const C=[...cand].map(Number).sort((a,b)=>a-b);
  const out=[];
  if(gHigh>1e-9){
    out.push({side:"매수",moc:true,q:Math.round(gHigh)});
    C.forEach(p=>{const bq=g(p)-g(rd(p+tick));if(bq>1e-9)out.push({side:"매수",moc:false,p,q:Math.round(bq)});});
  }else if(gLow<-1e-9){
    out.push({side:"매도",moc:true,q:Math.round(-gLow)});
    C.forEach(p=>{const sq=g(rd(p-tick))-g(p);if(sq>1e-9)out.push({side:"매도",moc:false,p,q:Math.round(sq)});});
  }else{
    C.forEach(p=>{const gp=g(p),gpu=g(rd(p+tick)),gpd=g(rd(p-tick));
      const bq=Math.max(gp,0)-Math.max(gpu,0), sq=Math.max(-gp,0)-Math.max(-gpd,0);
      if(bq>1e-9)out.push({side:"매수",moc:false,p,q:Math.round(bq)});
      if(sq>1e-9)out.push({side:"매도",moc:false,p,q:Math.round(sq)});});
  }
  return out;
}

function compute(){
  const orders=[...read(buyRows,"buy"),...read(sellRows,"sell")];
  const tick=parseFloat(tickEl.value)||0.01, dec=tickDecimals(tick);
  if(!orders.length){outEl.innerHTML='<div class="rempty">매수·매도 주문을 입력하세요</div>';verifyEl.innerHTML="";document.getElementById("rcount").textContent="";return;}
  let out=build(orders,tick);
  // 정렬: MOC 먼저, 그다음 가격순
  out.sort((a,b)=>(b.moc-a.moc)||((a.p??0)-(b.p??0)));
  outEl.innerHTML=out.map(o=>`<div class="rline ${o.side==='매수'?'b':'s'}">
    <span class="g">${o.side}</span><span class="m">${o.moc?'MOC':'LOC'}</span>
    <span class="v p">${o.moc?'—':o.p.toFixed(dec)}</span><span class="v">${o.q.toLocaleString('en-US')}</span></div>`).join("")
    || '<div class="rempty">넣을 주문이 없습니다 (전량 상쇄)</div>';
  document.getElementById("rcount").textContent=`원주문 ${orders.length}건 → ${out.length}건`;

  // 검증
  const rd=x=>Math.round(x/tick)*tick;
  const gOrig=C=>orders.reduce((n,o)=>{const f=o.t==="MOC"?true:(o.s==="buy"?C<=o.p+1e-9:C>=o.p-1e-9);return n+(f?(o.s==="buy"?o.q:-o.q):0);},0);
  const netO=C=>out.reduce((n,o)=>{const f=o.moc?true:(o.side==="매수"?C<=o.p+1e-9:C>=o.p-1e-9);return n+(f?(o.side==="매수"?o.q:-o.q):0);},0);
  const washO=C=>{const b=out.filter(o=>o.side==="매수"&&(o.moc||C<=o.p+1e-9)).reduce((a,o)=>a+o.q,0);
                  const s=out.filter(o=>o.side==="매도"&&(o.moc||C>=o.p-1e-9)).reduce((a,o)=>a+o.q,0);return Math.min(b,s);};
  const lp=orders.filter(o=>o.p!=null).map(o=>o.p); const lo=(lp.length?Math.min(...lp):50)-3, hi=(lp.length?Math.max(...lp):50)+3;
  let exact=true,nowash=true;
  for(let c=lo;c<=hi+1e-9;c=rd(c+tick)){const cr=rd(c);if(netO(cr)!==gOrig(cr))exact=false;if(washO(cr)!==0)nowash=false;}
  const tb=orders.filter(o=>o.s==="buy").reduce((a,o)=>a+o.q,0), ts=orders.filter(o=>o.s==="sell").reduce((a,o)=>a+o.q,0);
  verifyEl.innerHTML=`<span>모든 종가서 원주문과 체결 동일 <b class="${exact?'':'x'}">${exact?'✓':'✗'}</b></span>
    <span>자전거래 <b class="${nowash?'':'x'}">0 ${nowash?'✓':'✗'}</b></span>
    <span>원주문 총 매수 ${tb.toLocaleString('en-US')} · 매도 ${ts.toLocaleString('en-US')}</span>`;
}
let saveT;
function save(){
  const grab=box=>[...box.querySelectorAll(".row")].map(r=>({t:r.querySelector(".t").checked?"MOC":"LOC",p:r.querySelector(".p").value,q:r.querySelector(".q").value}));
  try{localStorage.setItem(KEY,JSON.stringify({tick:tickEl.value,b:grab(buyRows),s:grab(sellRows)}));}catch(e){}
  const s=document.getElementById("save");s.textContent="저장 중…";clearTimeout(saveT);saveT=setTimeout(()=>s.textContent="자동저장됨",400);
}
function example(){
  buyRows.innerHTML="";sellRows.innerHTML="";
  addRow("buy","LOC",70,20);addRow("buy","LOC",66,8);
  addRow("sell","LOC",65,15);addRow("sell","LOC",68,10);
  compute();save();
}
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  buyRows.innerHTML="";sellRows.innerHTML="";
  if(d&&(d.b||d.s)){tickEl.value=d.tick||"0.01";
    (d.b||[]).forEach(o=>addRow("buy",o.t||"LOC",o.p,o.q));(d.s||[]).forEach(o=>addRow("sell",o.t||"LOC",o.p,o.q));
    while(buyRows.children.length<2)addRow("buy");while(sellRows.children.length<2)addRow("sell");compute();}
  else example();
}
document.querySelectorAll(".addbtn").forEach(b=>b.onclick=()=>{addRow(b.dataset.side);});
document.getElementById("btnReset").onclick=()=>{buyRows.innerHTML="";sellRows.innerHTML="";for(let i=0;i<2;i++){addRow("buy");addRow("sell");}compute();save();};
document.getElementById("btnEx").onclick=example;
tickEl.addEventListener("input",()=>{compute();save();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)compute();});
load();
</script>
</body>
</html>
